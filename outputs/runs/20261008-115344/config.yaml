# Central settings for Component 2. Code reads values from here instead of hard-coding them.

seed: 42  # fixed so experiments are reproducible

paths:
  sentences_csv: data/sentences.csv
  videos_dir: data/videos
  manifest_csv: data/manifest.csv
  keypoints_dir: data/keypoints
  runs_dir: outputs/runs
  figures_dir: outputs/figures

data:
  # Signer used when a video file name has no _s<N> suffix (e.g. 008_t1.mp4).
  default_signer: s1

keypoints:
  # MediaPipe Holistic settings (0 = fastest, 2 = most accurate).
  model_complexity: 1
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

  # Low-light enhancement: CLAHE on the luminance (L) channel before detection.
  low_light_enhancement: false
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8

  # 130 landmarks per frame = 25 pose + 21 left hand + 21 right hand + 63 face.
  num_pose_landmarks: 25  # pose indices 0-24 (upper body; legs are not needed)
  # Generated by src/choose_face_indices.py: evenly spaced points along
  # lips (22), left eyebrow (5), right eyebrow (5), left eye (9),
  # right eye (9), nose (13).
  face_indices: [0, 39, 185, 146, 91, 84, 314, 321, 291, 270, 267, 13, 81, 191, 95, 178, 14, 402, 318, 308, 310, 312, 276, 282, 285, 334, 336, 46, 52, 55, 105, 107, 249, 466, 387, 385, 398, 362, 381, 374, 390, 7, 246, 160, 158, 173, 133, 154, 145, 163, 168, 197, 5, 1, 94, 97, 64, 48, 220, 326, 294, 344, 275]

preprocess:
  num_frames: 64          # every clip is resampled to this many frames
  max_gap_frames: 5       # hand gaps up to this long are filled by interpolation
  left_shoulder_index: 11   # MediaPipe pose landmark numbers
  right_shoulder_index: 12

augment:  # training only; never mirror left/right (it changes the meaning)
  time_factor_min: 0.8    # random temporal crop/stretch range
  time_factor_max: 1.2
  rotation_degrees: 10    # random rotation in [-10, +10] degrees
  scale_min: 0.9
  scale_max: 1.1
  noise_std: 0.01         # in shoulder-width units, i.e. 1% of shoulder width
  hand_dropout_probability: 0.5   # chance that a clip gets some hand frames dropped
  hand_dropout_max_frames: 3      # at most this many frames (of the 64) per clip

split:
  # Sentences that have take 2 or higher: train on these takes, test on the others.
  # Sentences with only take 1: that clip is used for both (with a loud warning).
  train_takes: [1]

text_baselines:  # baselines that translate gloss text (no video)
  num_folds: 5   # cross-validation by sentence, stratified by domain

nllb:
  model_id: facebook/nllb-200-distilled-600M
  source_lang: eng_Latn            # gloss tokens are English words
  target_langs:                    # verified to exist in the NLLB tokenizer
    sinhala: sin_Sinh
    english: eng_Latn
  # NLLB's tokenizer turns ZWJ (U+200D) into a space, which breaks Sinhala
  # conjuncts. We swap ZWJ for this character before tokenizing and swap it
  # back after decoding (checked: all 50 references survive this exactly).
  zwj_placeholder: "~"
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, out_proj]
  fp16: true
  batch_size: 4
  grad_accumulation_steps: 2       # effective batch size = 4 x 2 = 8
  learning_rate: 0.0005
  epochs: 30
  max_length: 64
  num_beams: 4
